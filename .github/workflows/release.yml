name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            main-exe: Padel.Manager.exe
          - os: ubuntu-latest
            rid: linux-x64
            main-exe: Padel.Manager
          - os: macos-latest
            rid: osx-arm64
            main-exe: Padel.Manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained -o publish/

      - name: Package
        shell: bash
        run: |
          ICON_FLAG=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ICON_FLAG="--icon icon.ico"
          fi
          vpk pack --packId PadelManager --packVersion ${{ steps.version.outputs.VERSION }} --packDir publish/ --mainExe "${{ matrix.main-exe }}" --runtime ${{ matrix.rid }} $ICON_FLAG

          # Only the Windows job owns the update manifest.
          # Linux and Mac remove it before uploading to avoid race conditions
          # where a non-Windows releases.json overwrites the Windows one.
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            rm -f Releases/releases.json Releases/RELEASES
          fi

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: Releases/*
          fail_on_unmatched_files: false
          generate_release_notes: true
